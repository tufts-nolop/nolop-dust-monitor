<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Red zone dust level</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --border: #2c3038;
    --text: #e6e6e6;
    --text-dim: #9aa0aa;
    --good: #4caf50;
    --bad: #ff5252;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
  }

  .title-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .title-row img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    flex-shrink: 0;
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }

  #status-panel {
    flex-shrink: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 13px;
    text-align: right;
    min-width: 200px;
  }

  #status-panel .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
    background: var(--bad);
  }

  #status-panel .dot.connected {
    background: var(--good);
  }

  #status-panel .dim {
    color: var(--text-dim);
    display: block;
    margin-top: 4px;
    font-size: 12px;
  }

  #plot {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    height: 600px;
  }
</style>
</head>
<body>

  <div class="header-row">
    <div class="title-row">
      <img src="https://nolop.org/wp-content/uploads/2019/08/cropped-nolop-hexagon-logo-outline-2019.png" alt="Nolop logo">
      <h1>Red zone dust level</h1>
    </div>
    <div id="status-panel">{% include "status.html" %}</div>
  </div>

  <div id="plot"></div>

  <script>
    const plotDiv = document.getElementById("plot");
    const statusPanel = document.getElementById("status-panel");

    // NOTE: uirevision is no longer set at the top level here. It's applied
    // per-axis below instead: "zoom" for the x-axis (so pan/zoom survives
    // each 5s Plotly.react() refresh), and a fresh value every poll for the
    // y-axes (so the dynamically computed range actually gets applied each
    // time instead of being frozen after the first render).
    const darkLayout = {
      paper_bgcolor: "#1c1f26",
      plot_bgcolor: "#1c1f26",
      font: { color: "#e6e6e6" },
      margin: { t: 20, r: 30, l: 60, b: 40 },
      legend: {
        x: 0.01,
        y: 0.97,
        xanchor: "left",
        yanchor: "top",
        bgcolor: "rgba(28, 31, 38, 0.75)",
        bordercolor: "#2c3038",
        borderwidth: 1,
        font: { color: "#e6e6e6" }
      },
      xaxis: {
        title: "Time",
        type: "date",
        gridcolor: "#2c3038",
        zerolinecolor: "#2c3038",
        rangeslider: { visible: true, thickness: 0.05, bgcolor: "#14161a", bordercolor: "#2c3038" },
        rangeselector: {
          bgcolor: "#242830",
          activecolor: "#3a4050",
          bordercolor: "#2c3038",
          font: { color: "#e6e6e6" },
          buttons: [
            { count: 15, label: "15m", step: "minute", stepmode: "backward" },
            { count: 1, label: "1h", step: "hour", stepmode: "backward" },
            { count: 8, label: "8h", step: "hour", stepmode: "backward" },
            { count: 24, label: "24h", step: "hour", stepmode: "backward" },
            { step: "all", label: "All" }
          ]
        }
      },
      yaxis: {
        title: "Particle Count",
        gridcolor: "#2c3038",
        zerolinecolor: "#2c3038",
        rangemode: "tozero"
      },
      yaxis2: {
        title: "Outdoor AQI",
        overlaying: "y",
        side: "right",
        showgrid: false,
        zerolinecolor: "#2c3038",
        rangemode: "tozero"
      }
    };

    const config = {
      responsive: true,
      displaylogo: false
    };

    let initialized = false;
    // Tracks the x-range we want displayed: [start, end] when zoomed to a
    // window, or null when the view should be autoranged ("All"). We manage
    // this ourselves and re-apply it on every refresh, since Plotly.react()
    // doesn't reliably preserve a programmatically-set range via uirevision.
    let currentXRange = null;
    // Whether the trailing "last 8 hours" window should keep advancing to
    // follow the latest data on each poll. Starts true (the default view);
    // goes false the moment the user manually zooms, pans, or picks a
    // rangeselector button, so the polling refresh doesn't yank them back
    // to the live window. Clicking "All" turns it back off too (that's a
    // deliberate choice to view the whole dataset, not "resume live").
    let followLive = true;
    const LIVE_WINDOW_MS = 8 * 60 * 60 * 1000;

    // Cache of the last /data.json payload, so the relayout listener can
    // recompute the y-axis range immediately on zoom/rangeselector clicks
    // without waiting for the next 5s poll.
    let lastData = null;

    // Finds the max value across one or more series, restricted to points
    // whose timestamp falls inside xRange (or all points, if xRange is null
    // i.e. "All" is selected). This is what makes the y-axis reflect only
    // the currently displayed window instead of the whole dataset.
    function windowedMax(timestamps, seriesArrays, xRange) {
      const startMs = xRange ? new Date(xRange[0]).getTime() : -Infinity;
      const endMs = xRange ? new Date(xRange[1]).getTime() : Infinity;
      let maxVal = 0;

      for (let i = 0; i < timestamps.length; i++) {
        const t = new Date(timestamps[i]).getTime();
        if (t < startMs || t > endMs) continue;

        for (const series of seriesArrays) {
          const v = series[i];
          if (typeof v === "number" && v > maxVal) maxVal = v;
        }
      }

      return maxVal;
    }

    function computeYRanges(data, xRange) {
      const dustMax = windowedMax(data.timestamps, [data.fine], xRange);
      const yMax = Math.max(data.y_floor, dustMax + 100);

      const outdoorMax = windowedMax(data.outdoor_timestamps, [data.outdoor_aqi], xRange);
      const outdoorYMax = Math.max(data.outdoor_y_floor, outdoorMax + 20);

      return { yMax, outdoorYMax };
    }

    // Track user-driven zoom/pan/rangeselector changes so the 5s polling
    // refresh doesn't clobber whatever the user last selected. plotDiv.on
    // only exists once Plotly has initialized the element, so this is
    // wired up right after the first Plotly.newPlot() call below.
    function attachRelayoutListener() {
      plotDiv.on("plotly_relayout", (eventData) => {
        if (eventData["xaxis.range[0]"] !== undefined && eventData["xaxis.range[1]"] !== undefined) {
          currentXRange = [eventData["xaxis.range[0]"], eventData["xaxis.range[1]"]];
          followLive = false; // user took manual control of the window
        } else if (Array.isArray(eventData["xaxis.range"])) {
          currentXRange = eventData["xaxis.range"];
          followLive = false;
        } else if (eventData["xaxis.autorange"]) {
          currentXRange = null; // user clicked "All" or double-clicked to reset
          followLive = false;   // stay on "All" rather than snapping back to live window
        } else {
          return; // not an x-range change, nothing to recompute
        }

        if (lastData) {
          const { yMax, outdoorYMax } = computeYRanges(lastData, currentXRange);
          // Triggers another plotly_relayout event, but it won't carry any
          // of the xaxis.* keys checked above, so it hits the early return
          // and doesn't recurse. Explicit relayout() calls aren't blocked
          // by uirevision, so this still applies immediately on zoom.
          Plotly.relayout(plotDiv, {
            "yaxis.range": [0, yMax],
            "yaxis2.range": [0, outdoorYMax]
          });
        }
      });
    }

    function buildTraces(data) {
      const traces = [
        {
          x: data.timestamps,
          y: data.fine,
          name: "Fine particles",
          mode: "lines",
          line: { color: "#4fc3f7", width: 1.0 }
        },
        {
          x: data.timestamps,
          y: data.coarse,
          name: "Coarse particles",
          mode: "lines",
          line: { color: "#ff8a65", width: 1.0 }
        }
      ];

      if (data.outdoor_timestamps.length) {
        traces.push({
          x: data.outdoor_timestamps,
          y: data.outdoor_aqi,
          name: "Outdoor AQI",
          mode: "lines",
          line: { color: "#b388ff", width: 1.0 },
          yaxis: "y2"
        });
      }

      data.thresholds.forEach((threshold) => {
        traces.push({
          x: data.timestamps.length ? [data.timestamps[0], data.timestamps[data.timestamps.length - 1]] : [],
          y: [threshold.value, threshold.value],
          name: threshold.label,
          mode: "lines",
          line: { color: threshold.color, width: 1.5, dash: "dash" },
          hoverinfo: "name+y"
        });
      });

      return traces;
    }

    async function refreshStatus() {
      try {
        const response = await fetch("/status-panel", { cache: "no-store" });
        statusPanel.innerHTML = await response.text();
      } catch (err) {
        statusPanel.textContent = "Unable to reach the dashboard server.";
      }
    }

    async function refreshPlot() {
      let data;
      try {
        const response = await fetch("/data.json", { cache: "no-store" });
        data = await response.json();
      } catch (err) {
        return;
      }

      lastData = data;
      const traces = buildTraces(data);
      const xaxisConfig = { ...darkLayout.xaxis, uirevision: "zoom" };

      // Recompute the trailing live window on every poll (not just the
      // first one) so the visible range keeps pace with new data, unless
      // the user has manually taken control of the view.
      if (followLive) {
        const latestTimestamp = data.timestamps.length
          ? data.timestamps[data.timestamps.length - 1]
          : null;

        if (latestTimestamp) {
          currentXRange = [
            new Date(new Date(latestTimestamp).getTime() - LIVE_WINDOW_MS),
            new Date(latestTimestamp)
          ];
        }
      }

      if (currentXRange) {
        xaxisConfig.range = currentXRange;
      }
      // else: leave range unset, letting Plotly autorange (this is "All")

      const { yMax, outdoorYMax } = computeYRanges(data, currentXRange);

      // A fresh uirevision value on every poll ensures Plotly.react() treats
      // the y-axis range as "new" each time and actually applies it, instead
      // of freezing it at whatever it was on the first render.
      const yRevision = Date.now();

      const layout = {
        ...darkLayout,
        xaxis: xaxisConfig,
        yaxis: {
          ...darkLayout.yaxis,
          range: [0, yMax],
          uirevision: yRevision
        },
        yaxis2: {
          ...darkLayout.yaxis2,
          range: [0, outdoorYMax],
          uirevision: yRevision
        }
      };

      if (!initialized) {
        Plotly.newPlot(plotDiv, traces, layout, config);
        attachRelayoutListener();
        initialized = true;
      } else {
        Plotly.react(plotDiv, traces, layout, config);
      }
    }

    refreshPlot();
    setInterval(refreshStatus, 5000);
    setInterval(refreshPlot, 5000);
  </script>
</body>
</html>
