<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Red Zone Air Quality</title>
    <style>
        :root {
            color-scheme: light;
            font-family: "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #f5efe6;
            color: #182126;
            overflow: hidden;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 16px;
            padding: 24px;
        }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #c9ba9f;
        }

        .title-block {
            display: grid;
            gap: 6px;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.24em;
            font-size: 0.74rem;
            font-weight: 700;
            color: #7b6b53;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.6rem, 2.4vw, 2.5rem);
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .subhead {
            margin: 0;
            color: #5d554c;
            font-size: 0.95rem;
            max-width: 700px;
        }

        .status-shell {
            min-width: min(360px, 100%);
            border: 1px solid #c9ba9f;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.72);
            box-shadow: 0 2px 10px rgba(24, 33, 38, 0.06);
        }

        iframe {
            width: 100%;
            height: 112px;
            border: 0;
            background: transparent;
        }

        .plot-frame {
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #c9ba9f;
            border-radius: 16px;
            background: #ffffff;
            overflow: hidden;
            box-shadow: 0 2px 16px rgba(24, 33, 38, 0.05);
        }

        .plot-frame img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 850px) {
            body { overflow: auto; padding: 16px; }
            header { flex-direction: column; align-items: flex-start; }
            .status-shell { width: 100%; }
            .plot-frame { min-height: 65vh; }
        }
    </style>
</head>
<body>
    <header>
        <div class="title-block">
            <div class="eyebrow">Nolop Makerspace</div>
            <h1>Red Zone Air Quality</h1>
            <p class="subhead">Monitoring particle counts in the red zone.</p>
        </div>
        <div class="status-shell">
            <iframe src="/status-panel" title="Dylos connection status"></iframe>
        </div>
    </header>

    <main class="plot-frame">
        <img id="plot-image" src="/plot.png?ts=0" alt="Live Dylos particle count plot">
    </main>

    <script>
        const plotImage = document.getElementById("plot-image");
        const refreshPlot = () => {
            plotImage.src = "/plot.png?ts=" + Date.now();
        };

        setInterval(refreshPlot, 3000);
    </script>
</body>
</html>
